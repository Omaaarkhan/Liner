appId: com.audio-ripper.desktop
productName: YouTube Audio Ripper
electronVersion: 34.0.0
directories:
  output: release
files:
  - dist-electron/**/*
  - dist-renderer/**/*
extraResources:
  - from: vendor/bin
    to: bin
    filter:
      - "**/*"
mac:
  category: public.app-category.music
  target:
    - dmg
    - zip
extraMetadata:
  main: dist-electron/main.js
