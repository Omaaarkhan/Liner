name: Release

# Push a tag like v0.2.0 to build installers and attach them to a draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild and replace the files of, e.g. v0.2.1"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon .dmg
            script: package:mac
          - os: macos-15-intel    # Intel .dmg
            script: package:mac
          - os: windows-latest    # x64 installer .exe
            script: package:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # electron-builder only publishes when GH_TOKEN is set, so this just builds.
      - run: npm run ${{ matrix.script }}
        env:
          # No Developer ID yet: macOS builds get the ad-hoc signature set in
          # electron-builder.yml, and Windows builds stay unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
